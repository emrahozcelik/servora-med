name: Prepare Ant Design 6.7.0 lockfile (temporary)
on:
  push:
    branches:
      - chore/antd-6-7-0
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate npm lockfile using canonical npm
        working-directory: web
        run: |
          set -euo pipefail
          npm install antd@6.7.0 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.dependencies.antd !== '6.7.0'||l.packages[''].dependencies.antd!=='6.7.0'||l.packages['node_modules/antd'].version!=='6.7.0')process.exit(1)"
      - name: Emit canonical lockfile for exact GitHub commit
        working-directory: web
        run: |
          node <<'NODE'
          const {readFileSync} = require('node:fs');
          const file = readFileSync('package-lock.json', 'utf8');
          console.log('SERVORA_LOCK_V1_BEGIN');
          for (const line of file.trimEnd().split('\n')) console.log('SERVORA_LOCK_V1_LINE:' + line);
          console.log('SERVORA_LOCK_V1_END');
          NODE
