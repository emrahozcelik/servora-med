name: Production Deploy

# OPS-DEPLOY-002: one operator action. Run workflow on `main`; the exact main
# SHA, its green push CI run and that run's release package are resolved here.
# No attempt UUID, root approval or hash is entered by hand.
on:
  workflow_dispatch:
    inputs:
      allow_migrations:
        description: Apply pending migrations shipped in this release (predeploy backup and ordered-prefix check stay mandatory)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Controlled production deployment
    # Playwright 1.55.1 supports Ubuntu 24.04; keep this aligned with the web CI job.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SERVORA_PROD_HOST: ${{ secrets.SERVORA_PROD_HOST }}
      SERVORA_PROD_SSH_USER: ${{ secrets.SERVORA_PROD_SSH_USER }}
      SERVORA_PROD_SSH_KEY: ${{ secrets.SERVORA_PROD_SSH_KEY }}
      SERVORA_PROD_KNOWN_HOSTS: ${{ secrets.SERVORA_PROD_KNOWN_HOSTS }}
      SERVORA_PROD_FQDN: ${{ vars.SERVORA_PROD_FQDN }}
    steps:
      - name: Validate deployment identity
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "NON_MAIN_WORKFLOW_REF" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "INVALID_DEPLOY_SHA" >&2; exit 1; }
          echo "DEPLOY_SHA=$GITHUB_SHA" >>"$GITHUB_ENV"

      - name: Checkout exact deployment SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checked out deployment SHA
        run: |
          set -Eeuo pipefail
          CHECKED_OUT_SHA="$(git rev-parse --verify HEAD)"
          [[ "$CHECKED_OUT_SHA" == "$DEPLOY_SHA" ]] || { echo "CHECKED_OUT_SHA_MISMATCH" >&2; exit 1; }

      - name: Resolve exact-main CI run for this SHA
        run: |
          set -Eeuo pipefail
          CI_RUN_ID="$(gh run list --workflow ci.yml --branch main --event push --commit "$DEPLOY_SHA" \
            --limit 20 --json databaseId,headSha,status,conclusion \
            --jq "[.[] | select(.headSha == \"$DEPLOY_SHA\" and .status == \"completed\" and .conclusion == \"success\")][0].databaseId // empty")"
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "EXACT_MAIN_CI_NOT_GREEN" >&2; exit 1; }
          echo "CI_RUN_ID=$CI_RUN_ID" >>"$GITHUB_ENV"

      - name: Download exact-main release artifact
        run: |
          set -Eeuo pipefail
          mkdir -m 700 "$RUNNER_TEMP/servora-release"
          gh run download "$CI_RUN_ID" \
            --name "servora-med-release-$DEPLOY_SHA" --dir "$RUNNER_TEMP/servora-release"
          test -f "$RUNNER_TEMP/servora-release/servora-med-$DEPLOY_SHA.tar.gz"
          test -f "$RUNNER_TEMP/servora-release/servora-med-$DEPLOY_SHA.tar.gz.sha256"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # Ubuntu's default apt mirrors can be down for hours; the Azure mirror
      # with bounded retries keeps --with-deps fast, and the timeout fails it
      # early instead of stalling the deployment.
      - name: Install browsers for production smoke
        working-directory: web
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          sudo bash ../ops/ci/use-azure-apt-mirror.sh
          npm ci
          npx playwright install --with-deps chromium webkit

      # The runner re-verifies the exact green push CI run, its release-package
      # job and the artifact hash/sidecar before any SSH. The host keeps the
      # pending-attempt refusal, predeploy backup, migration-history gate,
      # health, rollback-on-zero-migration and postdeploy backup.
      - name: Transfer, activate, smoke, back up and observe exact main SHA
        env:
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations }}
        run: |
          set -Eeuo pipefail
          deploy_args=(--sha "$DEPLOY_SHA" --ci-mode github --ci-run-id "$CI_RUN_ID" \
            --artifact "$RUNNER_TEMP/servora-release/servora-med-$DEPLOY_SHA.tar.gz")
          [[ "$ALLOW_MIGRATIONS" != true ]] || deploy_args+=(--allow-migrations)
          bash ops/deploy-production.sh "${deploy_args[@]}"
