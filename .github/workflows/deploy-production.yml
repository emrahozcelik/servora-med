name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Deploy this exact canonical main SHA
        required: true
        type: string
      allow_migrations:
        description: Explicitly authorize tracked production migrations
        required: true
        type: boolean
        default: false
      attempt_id:
        description: Previously issued root-owned approval UUID (migration only)
        required: false
        type: string
      ci_run_id:
        description: Successful exact-main push CI run with release-package (migration only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Controlled production deployment
    # Playwright 1.55.1 supports Ubuntu 24.04; keep this aligned with the web CI job.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SERVORA_PROD_HOST: ${{ secrets.SERVORA_PROD_HOST }}
      SERVORA_PROD_SSH_USER: ${{ secrets.SERVORA_PROD_SSH_USER }}
      SERVORA_PROD_SSH_KEY: ${{ secrets.SERVORA_PROD_SSH_KEY }}
      SERVORA_PROD_KNOWN_HOSTS: ${{ secrets.SERVORA_PROD_KNOWN_HOSTS }}
      SERVORA_PROD_FQDN: ${{ vars.SERVORA_PROD_FQDN }}
    steps:
      - name: Validate immutable deployment identity
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "INVALID_DEPLOY_SHA" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "NON_MAIN_WORKFLOW_REF" >&2; exit 1; }
          [[ "$GITHUB_SHA" == "$DEPLOY_SHA" ]] || { echo "DEPLOY_SHA_EVENT_MISMATCH" >&2; exit 1; }
          if [[ "$ALLOW_MIGRATIONS" == "true" ]]; then
            [[ "$ATTEMPT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] \
              || { echo "MIGRATION_ATTEMPT_ID_REQUIRED" >&2; exit 1; }
            [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "MIGRATION_CI_RUN_ID_REQUIRED" >&2; exit 1; }
          else
            [[ -z "$ATTEMPT_ID" && -z "$CI_RUN_ID" ]] \
              || { echo "MIGRATION_ARGUMENTS_NOT_ALLOWED" >&2; exit 1; }
          fi

      - name: Checkout exact deployment SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.deploy_sha }}
          fetch-depth: 0

      - name: Verify checked out deployment SHA
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
        run: |
          set -Eeuo pipefail
          CHECKED_OUT_SHA="$(git rev-parse --verify HEAD)"
          [[ "$CHECKED_OUT_SHA" == "$DEPLOY_SHA" ]] || { echo "CHECKED_OUT_SHA_MISMATCH" >&2; exit 1; }

      - name: Download exact-main release artifact for approved migration
        if: inputs.allow_migrations
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 "$RUNNER_TEMP/servora-release"
          gh run download "$CI_RUN_ID" \
            --name "servora-med-release-$DEPLOY_SHA" --dir "$RUNNER_TEMP/servora-release"
          test -f "$RUNNER_TEMP/servora-release/servora-med-$DEPLOY_SHA.tar.gz"
          test -f "$RUNNER_TEMP/servora-release/servora-med-$DEPLOY_SHA.tar.gz.sha256"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install browsers for production smoke
        working-directory: web
        run: |
          set -Eeuo pipefail
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Build, transfer, activate, smoke, and back up exact main SHA
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -Eeuo pipefail
          deploy_args=(--sha "$DEPLOY_SHA")
          if [[ "$ALLOW_MIGRATIONS" == "true" ]]; then
            deploy_args+=(--allow-migrations --attempt-id "$ATTEMPT_ID" \
              --ci-mode github --ci-run-id "$CI_RUN_ID" \
              --artifact "$RUNNER_TEMP/servora-release/servora-med-$DEPLOY_SHA.tar.gz")
          fi
          bash ops/deploy-production.sh "${deploy_args[@]}"
