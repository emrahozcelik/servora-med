name: Post Deploy Acceptance Temp
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: post-deploy-acceptance-temp
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVORA_PROD_HOST: ${{ secrets.SERVORA_PROD_HOST }}
      SERVORA_PROD_SSH_USER: ${{ secrets.SERVORA_PROD_SSH_USER }}
      SERVORA_PROD_SSH_KEY: ${{ secrets.SERVORA_PROD_SSH_KEY }}
      SERVORA_PROD_KNOWN_HOSTS: ${{ secrets.SERVORA_PROD_KNOWN_HOSTS }}
      SERVORA_PROD_FQDN: ${{ vars.SERVORA_PROD_FQDN }}
    steps:
      - name: Acceptance checks
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVORA_PROD_SSH_KEY" > ~/.ssh/id_acc
          printf '%s\n' "$SERVORA_PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_acc ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_acc -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=10"
          echo "=== GIT STATE ==="
          echo "DEPLOYED_RELEASE_SHA=f29d3eeb11064e8758b7e31d10e3b71770933f1c"
          echo "CURRENT_CANONICAL_MAIN_SHA=${{ github.sha }}"
          echo "=== CURRENT_SYMLINK ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'readlink -f /opt/servora-med/current; ls -ld /opt/servora-med/current; ls -d /opt/servora-med/releases/* | sort'
          echo "=== HEALTH_SCHEMA_VERSION ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'cat /etc/servora-med/servora-med.env | grep HEALTH_SCHEMA_VERSION; stat -c "%U:%G:%a %n" /etc/servora-med/servora-med.env || stat -f "%Su:%Sg:%p %N" /etc/servora-med/servora-med.env'
          echo "=== DB SCHEMA DIRECT via migration-state.mjs ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'sudo -n -u servora-med -- /bin/bash -c "set -a; source /etc/servora-med/servora-med.env; set +a; /usr/bin/node /opt/servora-med/current/ops/scripts/migration-state.mjs /opt/servora-med/current" 2>&1 | cat'
          echo "=== COLUMN AND CONSTRAINT ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'sudo -n -u servora-med -- /bin/bash -c "set -a; source /etc/servora-med/servora-med.env; set +a; psql \"\$DATABASE_URL\" -c \"SELECT column_name,is_nullable,data_type FROM information_schema.columns WHERE table_name='\''job_card_meeting_details'\'' AND column_name='\''unsuccessful_reason_code'\'';\" 2>&1 | cat"'
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'sudo -n -u servora-med -- /bin/bash -c "set -a; source /etc/servora-med/servora-med.env; set +a; psql \"\$DATABASE_URL\" -c \"SELECT conname, contype, pg_get_constraintdef(oid) FROM pg_constraint WHERE conrelid='\''job_card_meeting_details'\''::regclass AND conname LIKE '\''%unsuccessful%'\'';\" 2>&1 | cat"'
          echo "=== HISTORICAL DATA ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'sudo -n -u servora-med -- /bin/bash -c "set -a; source /etc/servora-med/servora-med.env; set +a; psql \"\$DATABASE_URL\" -c \"SELECT COUNT(*) AS total, COUNT(*) FILTER (WHERE unsuccessful_reason_code IS NULL) AS nulls, COUNT(*) FILTER (WHERE unsuccessful_reason_code IS NOT NULL) AS non_null FROM job_card_meeting_details;\" 2>&1 | cat"'
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'sudo -n -u servora-med -- /bin/bash -c "set -a; source /etc/servora-med/servora-med.env; set +a; psql \"\$DATABASE_URL\" -c \"SELECT COUNT(*) AS invalid FROM job_card_meeting_details WHERE unsuccessful_reason_code IS NOT NULL AND unsuccessful_reason_code NOT IN ('\''CONTACT_NOT_AVAILABLE'\'','\''CONTACT_BUSY'\'','\''CUSTOMER_UNREACHABLE'\'','\''REQUESTED_LATER'\'','\''OTHER'\'');\" 2>&1 | cat"'
          echo "=== SERVICE STATE ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'systemctl is-active servora-med.service; systemctl is-enabled servora-med.service; systemctl is-active caddy; systemctl is-active postgresql 2>&1 || systemctl is-active postgresql@15-main 2>&1 || echo pg-unknown; systemctl show servora-med.service -p MainPID --value | head'
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'systemctl show servora-med.service -p ActiveState -p SubState --value | cat; systemctl is-enabled servora-med.service; ls -l /etc/systemd/system/multi-user.target.wants/servora-med.service 2>&1 | cat'
          echo "=== HEALTH ENDPOINTS ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'curl -fsS http://127.0.0.1:3000/api/health 2>&1 | head -c 1000; echo; curl -fsS https://${SERVORA_PROD_FQDN}/api/health 2>&1 | head -c 1000; echo; curl -fsS https://${SERVORA_PROD_FQDN}/ -o /dev/null -w "WEB %{http_code} %{size_download}\n" 2>&1 | cat; curl -k -I https://${SERVORA_PROD_FQDN}/ 2>&1 | grep -i strict -c | cat'
          echo "=== LOGS ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'journalctl -u servora-med.service --since "2026-09-02 14:00:00" --no-pager 2>&1 | tail -n 100 | cat'
          echo "=== HELPER SHA ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'sha256sum /usr/local/libexec/servora-med/deploy-production-host 2>&1 | cat; stat -c "%U:%G:%a %n" /usr/local/libexec/servora-med/deploy-production-host 2>&1 || stat -f "%Su:%Sg:%p %N" /usr/local/libexec/servora-med/deploy-production-host'
          echo "=== BACKUPS ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'ls -ltr /var/backups/servora-med/servora-med-*.dump 2>&1 | tail -n 10; ls -ltr /var/backups/servora-med/servora-med-*.dump.sha256 2>&1 | tail -n 10; ls -lh /var/backups/servora-med/ 2>&1 | head -n 20'
          echo "=== BUSINESS COUNTS via migration-state ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'sudo -n -u servora-med -- /bin/bash -c "set -a; source /etc/servora-med/servora-med.env; set +a; /usr/bin/node /opt/servora-med/current/ops/scripts/migration-state.mjs /opt/servora-med/current" 2>&1 | grep -E "organizations|users|staff|customers|products|jobs|demo_data|catalog_head|applied" | cat'
          echo "=== GEOLOCATION CONFIG ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'grep -E "ACTION_SCOPED_GEOLOCATION|REVERSE_GEOCODER|GEOCODING" /etc/servora-med/servora-med.env 2>&1 | sed "s/GOOGLE_GEOCODING_API_KEY=.*/GOOGLE_GEOCODING_API_KEY=PRESENT/" | cat'
          echo "=== RUNTIME CODE CHECK ==="
          $SSH "$SERVORA_PROD_SSH_USER@$SERVORA_PROD_HOST" 'grep -n "FOLLOW_UP_MIN_LEAD" /opt/servora-med/current/server/dist/modules/job-cards/follow-up-policy.js 2>&1 | head; grep -n "LOCATION_REQUIRED" /opt/servora-med/current/server/dist/modules/job-cards/service.js 2>&1 | head'
